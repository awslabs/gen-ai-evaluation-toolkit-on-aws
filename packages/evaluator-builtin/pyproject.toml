[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awssolutions-gen-ai-evaluation-toolkit-evaluator-builtin"
version = "2.0.0"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "awssolutions-gen-ai-evaluation-toolkit-evaluator-sdk @ {root:uri}/../evaluator-sdk",
  "awssolutions-gen-ai-evaluation-toolkit-python-client @ {root:uri}/../generated/python-client",
  # Required by deepeval's AmazonBedrockModel (lazily imports aiobotocore.session);
  # deepeval declares it as an optional extra, so it must be pinned explicitly.
  "aiobotocore",
  "deepeval>=3.7",
  "langchain-aws>=0.2.0",
  "langchain-core",
  "pyyaml",
  "ragas>=0.3.4",
]

[dependency-groups]
dev = [
  "hatchling",
  "mypy",
  "types-PyYAML",
  "ruff",
  "pytest",
  "pytest-cov",
  "moto[dynamodb]",
  "boto3",
  "awssolutions-gen-ai-evaluation-toolkit-python-api",
]

[tool.uv.sources]
awssolutions-gen-ai-evaluation-toolkit-python-api = { path = "../python-api", editable = true }

[tool.uv]
override-dependencies = [
  # Transitive via mlflow-skinny. <3.1.53 is vulnerable to command injection
  # (long-option prefix abbreviation, unsafe clone option gate bypass,
  # Repo.archive()/ls_remote()/iter_commits()) and env-var exfiltration.
  "gitpython>=3.1.53",
  # Transitive via mlflow-skinny, which caps protobuf <5 — but the 4.x line
  # never received the fix for the json_format recursion-depth bypass DoS
  # (patched in 5.29.6). 5.29.x is the maintained LTS line and remains
  # wire- and API-compatible for mlflow's usage.
  "protobuf>=5.29.6,<6",
  "boto3>=1.34",
  # ragas 0.4.x (latest) still imports langchain_community.chat_models.vertexai,
  # which was moved out of langchain-community in 0.4.0. Cap the transitive
  # to keep tests import-clean until ragas ships a fix.
  "langchain-community<0.4",
]

[tool.pytest.ini_options]
addopts = ["--durations=5", "--color=yes"]
testpaths = ["tests/unit", "tests/onebox"]
markers = [
  "e2e: marks tests as end-to-end (requires real AWS/Bedrock, run with: pytest tests/e2e -m e2e)",
]

[tool.coverage.run]
branch = true
parallel = true
source_pkgs = ["evaluator_builtin"]

[tool.coverage.paths]
"evaluator_builtin" = ["src/evaluator_builtin"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:"]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
]
isort.known-first-party = ["evaluator_builtin"]
exclude = ["./build", ".venv"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
directory = "./build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluator_builtin"]
require-runtime-dependencies = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
files = ["src/**/*.py"]
