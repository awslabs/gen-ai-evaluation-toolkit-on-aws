[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awssolutions-gen-ai-evaluation-toolkit-python-api"
version = "2.0.0"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aws-lambda-powertools >= 2.11.0",
  "pydantic >= 2.0",
  "boto3 >= 1.34",
  "mypy-boto3-dynamodb",
  "awssolutions_gen_ai_evaluation_toolkit_python_client @ {root:uri}/../generated/python-client",
  "setuptools>=78.1.1,<81",
  "mlflow-skinny==2.13.2",
  "sagemaker-mlflow-skinny==0.1.1",
]

[dependency-groups]
dev = [
  "mypy",
  "ruff",
  "boto3-stubs[full]",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "coverage[toml]",
  "moto[dynamodb,sqs]",
]

[tool.uv]
override-dependencies = [
  # Transitive via mlflow-skinny. <3.1.53 is vulnerable to command injection
  # (long-option prefix abbreviation, unsafe clone option gate bypass,
  # Repo.archive()/ls_remote()/iter_commits()) and env-var exfiltration.
  "gitpython>=3.1.53",
  # Transitive via mlflow-skinny, which caps protobuf <5 — but the 4.x line
  # never received the fix for the json_format recursion-depth bypass DoS
  # (patched in 5.29.6). 5.29.x is the maintained LTS line and remains
  # wire- and API-compatible for mlflow's usage.
  "protobuf>=5.29.6,<6",
]

[tool.pytest.ini_options]
addopts = ["--durations=5", "--color=yes", "-m", "not e2e and not mlflow"]
testpaths = ["tests"]
markers = [
  "e2e: marks tests as end-to-end (requires real AWS, run with: pytest -m e2e)",
  "mlflow: marks tests requiring real MLflow (run with: pytest -m mlflow)",
  "onebox_only: marks tests that use mocks incompatible with e2e (auto-skipped when ETK_TEST_MODE=e2e)",
]

### TEST COVERAGE

[tool.coverage.run]
branch = true
parallel = true
source_pkgs = ["evaluator_api"]

[tool.coverage.paths]
"evaluator_api" = ["src/evaluator_api"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]
show_missing = true

[tool.coverage.xml]
output = "build/documentation/coverage/coverage.xml"

[tool.coverage.html]
directory = "build/documentation/coverage/"

### FORMATTING AND LINTING

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
]
isort.known-first-party = ["evaluator_api"]
exclude = ["./build", ".venv", "private"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

### HATCH CONFIGURATION

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
directory = "./build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluator_api"]
require-runtime-dependencies = true

# Type checking configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_no_return = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_subclassing_any = false
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
strict_equality = true
strict_concatenate = true
implicit_reexport = false
warn_incomplete_stub = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
files = ["src/**/*.py"]
[[tool.mypy.overrides]]
module = "awssolutions_gen_ai_evaluation_toolkit_python_client.*"
implicit_reexport = true

