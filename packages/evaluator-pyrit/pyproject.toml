[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awssolutions-gen-ai-evaluation-toolkit-evaluator-pyrit"
version = "2.0.0"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "awssolutions-gen-ai-evaluation-toolkit-evaluator-sdk @ {root:uri}/../evaluator-sdk",
  "awssolutions-gen-ai-evaluation-toolkit-python-client @ {root:uri}/../generated/python-client",
  "pyrit>=0.13.0,<1.0",
]

[dependency-groups]
dev = [
  "hatchling",
  "mypy",
  "ruff",
  "pytest",
  "pytest-cov",
  "pytest-asyncio",
]

[tool.uv.sources]
awssolutions-gen-ai-evaluation-toolkit-evaluator-sdk = { path = "../evaluator-sdk", editable = true }

[tool.pytest.ini_options]
addopts = ["--durations=5", "--color=yes"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
parallel = true
source_pkgs = ["evaluator_pyrit"]

[tool.coverage.paths]
"evaluator_pyrit" = ["src/evaluator_pyrit"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:"]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4"]
isort.known-first-party = ["evaluator_pyrit"]
exclude = ["./build", ".venv"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
directory = "./build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluator_pyrit"]
require-runtime-dependencies = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
files = ["src/**/*.py"]
