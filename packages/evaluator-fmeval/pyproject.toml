[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awssolutions-gen-ai-evaluation-toolkit-evaluator-fmeval"
version = "2.0.0"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "awssolutions-gen-ai-evaluation-toolkit-evaluator-sdk @ {root:uri}/../evaluator-sdk",
  "awssolutions-gen-ai-evaluation-toolkit-python-client @ {root:uri}/../generated/python-client",
  "fmeval",
  "setuptools>=78.1.1",
]

[dependency-groups]
dev = [
  "hatchling",
  "mypy",
  "ruff",
  "pytest",
  "pytest-cov",
]

# fmeval@1.2.3 hard-pins ray==2.44.0 which is affected by CVE-2025-62593 (DNS
# rebinding, fixed in 2.52.0), CVE-2025-34351 (auth off by default), and
# CVE-2026-27482 (fixed in 2.54.0). Override to a patched version. The Ray
# APIs fmeval uses (ray.data, ray.actor.ActorHandle, and the private
# FileBasedDatasource / _resolve_kwargs symbols) are preserved in 2.54.
# CVE-2023-48022 ("ShadowRay" Jobs API RCE) has no upstream fix — Anyscale
# disputes it and mitigates by not exposing the Ray dashboard to the internet.
[tool.uv]
override-dependencies = [
  "ray>=2.54.0",
  # sagemaker <2.257.2 is affected by insecure-TLS, exposed/cleartext HMAC
  # signing key, and JumpStart eval() findings; 2.257.2 is the patched tail
  # of the 2.x line and stays within fmeval's sagemaker<3 requirement.
  "sagemaker>=2.257.2,<3",
  # sagemaker 2.257.2+ needs pandas>=2.3.0 while fmeval pins pandas==2.2.3;
  # 2.3.x is a compatible minor release of the same pandas 2 API.
  "pandas>=2.3.0,<3",
]

[tool.pytest.ini_options]
addopts = ["--durations=5", "--color=yes", "-m", "not e2e"]
testpaths = ["tests"]
markers = [
  "e2e: marks tests as end-to-end (requires fmeval installed, run with: pytest -m e2e)",
]

[tool.coverage.run]
branch = true
parallel = true
source_pkgs = ["evaluator_fmeval"]

[tool.coverage.paths]
"evaluator_fmeval" = ["src/evaluator_fmeval"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:"]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
]
isort.known-first-party = ["evaluator_fmeval"]
exclude = ["./build", ".venv"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
directory = "./build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluator_fmeval"]
require-runtime-dependencies = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
files = ["src/**/*.py"]
